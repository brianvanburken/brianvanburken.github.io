[tools]
deno = "2.9.4"
zola = "0.22.1"

[tasks.format]
description = "Format files"
run = "deno fmt . content/*.md"

[tasks.clean]
description = "Remove build output directory"
run = "rm -rf public"

[tasks.serve]
description = "Start development server with drafts"
depends = ["clean"]
run = "zola serve --drafts || true"

[tasks.build]
description = "Build site for production"
depends = ["clean"]
run = ["zola build", "deno run --allow-read --allow-write --allow-env --allow-sys scripts/build.js"]
