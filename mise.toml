[tools]
"github:aubepkg/aube" = "2.8.2"
node = "26.12.1"
zola = "0.23.6"

[tasks."format:fix"]
description = "Format files"
run = "aubx oxfmt ."

[tasks."format:check"]
description = "Check file formatting"
run = "aubx oxfmt --check ."

[tasks."lint:check"]
description = "Lint JavaScript files"
run = "aubx oxlint --deny-warnings"

[tasks.test]
description = "Run build script tests"
run = "node --test 'scripts/*.test.js'"

[tasks.clean]
description = "Remove build output directory"
run = "rm -rf public"

[tasks.serve]
description = "Start development server with drafts"
depends = ["clean"]
run = "zola serve --drafts || true"

[tasks.build]
description = "Build site for production"
depends = ["clean"]
run = ["zola build", "node scripts/build.js"]
