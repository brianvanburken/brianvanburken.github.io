<article>
  <a href="{{ page.path }}">{{ page.title }}</a>
  &mdash; {{ page.extra.excerpt | default(value="") }}
  <br />
  <time datetime="{{ page.date | date(format='%Y-%m-%d') }}">
    {{ page.date | date(format=config.extra.date_format) }}
  </time>
  {% include "partials/tags-list.html" %}
</article>
