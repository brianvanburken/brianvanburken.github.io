name: Build and deploy Zola site to GitHub Pages
on:
  push:
    branches:
      - main
  pull_request:
permissions: {}
jobs:
  build:
    runs-on: ubuntu-24.04
    # Runs pull request code, so it gets no deploy credentials
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop --command bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: aube-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-aube-${{ hashFiles('pnpm-lock.yaml') }}
      - run: aube install
        if: steps.aube-cache.outputs.cache-hit != 'true'
      - run: aubr format:check
      - run: aubr lint:check
      - run: aubr test
      - run: aubr build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push'
        with:
          path: ./public
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
